services:
  - type: web
    name: simpus-mini
    runtime: docker
    plan: free
    rootDir: jobsheet-10
    dockerfilePath: ./Dockerfile
    healthCheckPath: /index.php
    envVars:
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "5432"
      - key: DB_NAME
        value: "neondb"
      - key: DB_USER
        sync: false
      - key: DB_PASS
        sync: false
      - key: DB_SSLMODE
        value: "require"
